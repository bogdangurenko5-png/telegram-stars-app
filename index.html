<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Stars Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #18222d);
            --text: var(--tg-theme-text-color, #ffffff);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
        }
        h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .price {
            font-weight: bold;
            color: var(--btn);
        }
        button {
            background-color: var(--btn);
            color: var(--btn-text);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <h2>Telegram Stars ⭐</h2>
    
    <div class="card">
        <div>⭐ 100</div>
        <div class="price">100 XTR</div>
        <button onclick="buyItem('stars', 100, 100)">Купить</button>
    </div>

    <div class="card">
        <div>⭐ 500</div>
        <div class="price">500 XTR</div>
        <button onclick="buyItem('stars', 500, 500)">Купить</button>
    </div>

    <h2>Telegram Premium 💎</h2>
    
    <div class="card">
        <div>💎 Премиум на 1 месяц</div>
        <div class="price">250 XTR</div>
        <button onclick="buyItem('premium', 1, 250)">Оформить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function buyItem(itemType, amount, price) {
            const data = JSON.stringify({
                item: itemType,
                amount: amount,
                price: price
            });
            tg.sendData(data);
        }
    </script>
</body>
</html>
